esphome:
  name: ses-test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
logger:
ota:
  - platform: esphome

# MAX98357A: LRC=D25, BCLK=D26, DIN=D27
i2s_audio:
  i2s_lrclk_pin: GPIO25
  i2s_bclk_pin: GPIO26

speaker:
  - platform: i2s_audio
    id: spk
    dac_type: external
    i2s_dout_pin: GPIO27
    channel: mono

rtttl:
  speaker: spk
  id: melodi

button:
  - platform: template
    name: "Test Melodisi"
    on_press:
      - rtttl.play: "test:d=8,o=5,b=180:c,e,g,c6"
